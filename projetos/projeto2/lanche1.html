<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="images/logo1.png">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');

        .piscar:hover {
            color: #f3be1b !important;
        }

        .clik:hover {
            background-color: #007531;
            color: #ffffff;
            cursor: pointer;
        }

        #enviar:hover {
            background-color: #00491e;
        }
    </style>
</head>

<body>

    <div style="min-height: 100vh;" class=" d-flex flex-column ">

        <header id="inicio" style="min-height: 10vh;">

            <nav class="navbar bg-body-tertiary"
                style="height: 10vh;display: flex;align-items: center;justify-content: center;background-color: #00491e;">
                <div class="container-fluid" style="background-color: #00491e;">
                    <a class="navbar-brand" href="#" style="color: rgb(255, 255, 255);">
                        <img src="./images/logo.png" alt="Logo" class="img-fluid" width="200" height="50"
                            class="d-inline-block align-text-top">
                    </a>
                    <ul class="nav justify-content-center">
                        <li class="nav-item">
                            <a class="nav-link piscar" href="./projeto2.html"
                                style="color: rgb(255, 255, 255);"><b>Inicio</b></a>
                        </li>
                    </ul>
                </div>
            </nav>

        </header>

        <main class="container-fluid" >
                
            <section class="row" style="min-height: 100vh;display: flex;align-items: center;justify-content: center;">

               

                    <!--Lado Esquerdo-->
                    <div  class="col-12 col-md-6" style="min-height: 100vh;display: flex;align-items: center;justify-content: center;">

                        <div style="width: 85%;height: 85%;display: flex;align-items: center;justify-content: center;">
                            <img src="./images/lanche1-qualidade.png" alt="" class="img-fluid" height="100%">
                        </div>

                    </div>

                    <!--Lado Direito-->
                    <div  class="col-12 col-md-6" style="min-height: 100vh;background-color: rgb(139, 0, 0);display: flex;align-items: center;justify-content: center;flex-direction: column;">

                        <div style="height: 55%;width: 100%;background-color: aqua;display: flex;align-items: center;justify-content: center; flex-direction: column;">
                            <img src="./images/logo-lanche1-1.png" alt="" class="img-fluid">
                            <img src="./images/logo-lanche1-2.png" alt="" class="img-fluid">
                        </div>
                    </div>
               

            </section>
        </main>

        <footer class="mt-auto d-flex align-items-center justify-content-center"
            style="min-height: 10vh;background-color: #00491e!important;">

            <ul class="nav justify-content-center">
                <img src="./images/logo2.png" alt="" class="img-fluid">


            </ul>

        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script>
        // getOrCreateInstance example
        const popover = bootstrap.Popover.getOrCreateInstance('#enviar') // Returns a Bootstrap popover instance

        // setContent example
        popover.setContent({
            '.popover-header': 'Enviado com sucesso!',
            '.popover-body': ' Entraremos em contato em no máximo 24h com mais informações pelo email cadastrado. Caso contrario confira se o número cadastrado está correto e se necessario refassa o cadastro! Nossa equipe agradece o seu interesse e prezamos pelo seu entretenimento. Até logo!'
        })
    </script>
</body>

</html>
